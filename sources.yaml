    type: rss
    section: 경제·증시
    url: https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=ko&gl=KR&ceid=KR:ko
  - name: Google News IT
    type: rss
    section: IT·AI
    url: https://news.google.com/rss/headlines/section/topic/TECHNOLOGY?hl=ko&gl=KR&ceid=KR:ko
  - name: Google News 부동산
    type: rss
    section: 부동산·정책
    url: https://news.google.com/rss/search?q=부동산+정책&hl=ko&gl=KR&ceid=KR:ko
  - name: Google News 사회
    type: rss
    section: 사회·생활
    url: https://news.google.com/rss/headlines/section/topic/NATION?hl=ko&gl=KR&ceid=KR:ko
  - name: 연합뉴스
    type: rss
    section: 사회·생활
    url: https://www.yna.co.kr/rss/news.xml
  - name: 한국경제
    type: rss
    section: 경제·증시
    url: https://www.hankyung.com/feed/all-news
  - name: 매일경제
    type: rss
    section: 경제·증시
    url: https://www.mk.co.kr/rss/30000001/
  - name: 전자신문
