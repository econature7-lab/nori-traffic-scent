# 노리짱 트래픽센트 v2 · 수집 소스 정의
# ---------------------------------------------------------------
# collector.py 가 읽는 소스 목록입니다. (collector 는 표준 라이브러리만 사용)
#  · type: rss | html | api | manual
#  · key : 필요한 환경변수 (없으면 자동으로 skip + collect_log 기록)
#  · 이 파일은 문서이자 설정입니다. PyYAML 이 설치되어 있으면 collector 가
#    feeds 항목을 이 파일에서 덮어쓰고, 없으면 내장 기본값으로 동작합니다.
# ---------------------------------------------------------------

meta:
  schema: nori-traffic-scent/2
  timezone: Asia/Seoul
  schedule: "07:00 / 19:00 KST (cron 0 22 * * * , 0 10 * * *)"
  user_agent: "Mozilla/5.0 (compatible; NoriTrafficScent/2.0)"
  request_policy:
    timeout_sec: 15
    retries: 1
    per_host_requests_per_run: 1
    respect_robots: true
    skip_on_block: true

# ── 1. 일반 커뮤니티 인기글 (9곳) ─────────────────────────────
community:
  - name: 실시간베스트
    type: html
    url: https://m.dcinside.com/board/dcbest
    note: 디시인사이드 실시간 베스트 · 공개 목록 1회 요청
  - name: 톡커들의 선택
    type: html
    url: https://pann.nate.com/talk/ranking
  - name: 개드립
    type: html
    url: https://www.dogdrip.net/dogdrip
    note: 403 차단 시 자동 skip
  - name: 보배드림
    type: html
    url: https://www.bobaedream.co.kr/list?code=best
  - name: 에펨카리아
    type: html
    url: https://www.fmkorea.com/best
    note: 430 차단 시 자동 skip
  - name: 더쿠
    type: html
    url: https://theqoo.net/hot
  - name: 클리앙
    type: html
    url: https://www.clien.net/service/board/park
  - name: 인스티즈
    type: html
    url: https://www.instiz.net/bbs/list.php?bbs=pt
  - name: 루리웹
    type: html
    url: https://bbs.ruliweb.com/best/board/300143

# ── 2. 실시간 주요 뉴스 ──────────────────────────────────────
news:
