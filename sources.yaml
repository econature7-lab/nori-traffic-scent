# ── 3. 유튜브 ────────────────────────────────────────────────
youtube:
  api:
    type: api
    key: YOUTUBE_API_KEY
    endpoint: https://www.googleapis.com/youtube/v3/videos
    params: part=snippet,statistics&chart=mostPopular&regionCode=KR&maxResults=12
    quota_note: videos.list(chart=mostPopular) 1회 = 1 unit, search.list 1회 = 100 units
  channels:
    - name: 노리짱
      channel_id: UCRKzHmHb1o2KyxcLwr3MI8Q
      type: rss
      url: https://www.youtube.com/feeds/videos.xml?channel_id=UCRKzHmHb1o2KyxcLwr3MI8Q
    - name: SBS News
      channel_id: UCupDOc54HJbIPtgLjhABOZw
      type: rss
    - name: YTN
      channel_id: UChlgI3UHCOnwUGzWzbJ3H5w
      type: rss
    - name: JTBC
      channel_id: UCKCr4I-_ttdIhKVesomSKaQ
      type: rss

# ── 4. 블로그 · 글감 ─────────────────────────────────────────
blogs:
  - name: GeekNews
    type: rss
    url: https://news.hada.io/rss/news
  - name: 슬로우뉴스
    type: rss
    url: https://slownews.kr/feed
  - name: 바이라인네트워크
    type: rss
    url: https://byline.network/feed/
  - name: 네이버 블로그 검색
    type: api
    key: NAVER_CLIENT_ID / NAVER_CLIENT_SECRET
    url: https://openapi.naver.com/v1/search/blog.json
  - name: 내 블로그 RSS (선택)
    type: rss
    url: https://rss.blog.naver.com/{blogId}.xml
    note: blogId 를 채우면 내 블로그 최신 글이 함께 들어옵니다

# ── 5. 핫딜 ─────────────────────────────────────────────────
deals:
  - name: 네이버 쇼핑 최저가
    type: api
    key: NAVER_CLIENT_ID / NAVER_CLIENT_SECRET
    url: https://openapi.naver.com/v1/search/shop.json
  - name: 쿠팡 파트너스
    type: manual
    note: 파트너스 Open API 는 승인 후 사용. 미승인 상태에서는 큐레이션 목록 사용
  - name: 뽐뿌 · 알구몬
    type: manual
    note: 공개 RSS 미제공 → 수집 제목 매칭 또는 수동 큐레이션

# ── 6. 오픈소스 ─────────────────────────────────────────────
opensource:
  - name: GitHub Trending (daily)
    type: html
    url: https://github.com/trending?since=daily

# ── 7. 앱 · 게임 순위 ───────────────────────────────────────
apps:
  - name: Apple App Store 무료 앱
    type: api
    url: https://rss.applemarketingtools.com/api/v2/kr/apps/top-free/10/apps.json
  - name: Steam 최다 플레이
    type: api
    url: https://api.steampowered.com/ISteamChartsService/GetMostPlayedGames/v1/

# ── 8. 해커톤 · 공모전 ──────────────────────────────────────
hackathons:
  - name: Devpost Open Hackathons
    type: api
    url: https://devpost.com/api/hackathons?status[]=open&order_by=deadline
  - name: 국내 공모전(위비티·링커리어)
    type: manual
    note: 로그인·차단 정책상 자동 수집 제외 → 필요 시 수동 입력

# ── 9. 특화 5분야 보강 ──────────────────────────────────────
specialized:
  - cat: build
    name: 나라장터 입찰공고(건축설계)
    type: api
    key: DATA_GO_KR_KEY
    url: https://apis.data.go.kr/1230000/BidPublicInfoService04/getBidPblancListInfoServc
  - cat: estate
    name: 국토부 아파트 매매 실거래가
    type: api
    key: DATA_GO_KR_KEY
    url: https://apis.data.go.kr/1613000/RTMSDataSvcAptTradeDev/getRTMSDataSvcAptTradeDev
    note: LAWDI 코드(예 11140) + 계약월 조합으로 조회
  - cat: mom
    name: 네이버 카페·블로그 검색
    type: api
    key: NAVER_CLIENT_ID / NAVER_CLIENT_SECRET
    url: https://openapi.naver.com/v1/search/cafearticle.json
  - cat: apptech
    name: 네이버 쇼핑·블로그 검색
    type: api
    key: NAVER_CLIENT_ID / NAVER_CLIENT_SECRET
  - cat: ai
    name: GeekNews · AI 뉴스
    type: rss
    url: https://news.hada.io/rss/news

# ── 10. 급상승 키워드 ──────────────────────────────────────
trends:
  - name: Google Trends KR 급상승
    type: rss
    url: https://trends.google.co.kr/trending/rss?geo=KR
  - name: 네이버 데이터랩 (선택)
    type: api
    key: NAVER_CLIENT_ID / NAVER_CLIENT_SECRET
    note: 검색어 트렌드 API 는 별도 신청

# ── 11. AI 요약 ────────────────────────────────────────────
summary:
  provider: Google Gemini
  model: gemini-2.5-flash
  key: GEMINI_API_KEY
  free_tier: "Gemini API 무료 티어 (Flash 계열) · 하루 2회 호출"
  fallback: 규칙 기반 요약 (summarize.py 내장 · 키 없이도 data.json 생성)

# ── 12. 벤치마크 (수동 큐레이션) ────────────────────────────
benchmarks:
  metric_labels: [지능, 속도, 가성비]
  note: 공개 벤치마크 점수를 참고해 월 1회 손으로 갱신합니다.
