name: collect

# 트렌드픽 TrendPick v3 · 하루 2회 자동 수집 (07:17 / 19:17 KST)
# GitHub Actions cron 은 UTC 기준입니다 → 22:17 UTC = 07:17 KST, 10:17 UTC = 19:17 KST
# (정각은 GitHub 대기열이 몰려 수십 분씩 밀리므로 17분으로 어긋나게 잡았습니다.)
on:
  schedule:
    - cron: '17 22 * * *'   # 07:17 KST
    - cron: '17 10 * * *'   # 19:17 KST
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write           # data.json · index.html 자동 커밋

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 패키지 설치 (선택 사항 · 비어 있어도 통과)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 수집 (collector.py)
        env:
          # 필요한 키만 Settings → Secrets 에 넣으면 자동 사용되고,
          # 없으면 해당 소스만 안전하게 건너뜁니다.
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python collector.py

      - name: AI 요약 (summarize.py · 키 없으면 규칙 기반 유지)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: python summarize.py

      - name: 화면 재빌드 (build.py)
        run: python build.py

      - name: data.json · index.html · 고정 페이지 자동 커밋
        run: |
          git config user.name  "trendpick[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data.json data/ index.html \
                  about.html policy.html privacy.html contact.html \
                  robots.txt sitemap.xml
          if git diff --cached --quiet; then
            echo "변경 없음 · 커밋 생략"
          else
            git commit -m "data: trendpick auto collect $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi

      - name: 수집 로그 요약
        if: always()
        run: |
          echo "=== data.json 상태 ==="
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("data.json")
          if not p.exists():
              print("data.json 없음")
              raise SystemExit(0)
          d = json.loads(p.read_text(encoding="utf-8"))
          print("generated_at:", d.get("generated_at"))
          print("posts:", len(d.get("posts", [])), "news:", len(d.get("news", [])),
                "videos:", len(d.get("videos", [])), "blogs:", len(d.get("blogs", [])))
          th = d.get("thumbs", {}).get("all", {})
          print("thumbnail:", th.get("with_image"), "/", th.get("total"),
                f"({round((th.get('rate') or 0) * 100)}%)")
          ok = [r for r in d.get("collect_log", []) if r["status"] == "ok"]
          skip = [r for r in d.get("collect_log", []) if r["status"] != "ok"]
          print("성공 소스:", len(ok), "/ 기타:", len(skip))
          for r in skip:
              print("  -", r["source"], r["status"], r.get("error", "")[:60])
          c = pathlib.Path("data/creators.json")
          if c.exists():
              cc = json.loads(c.read_text(encoding="utf-8"))
              print("creators.json:", cc.get("generated_at"),
                    "topics", {k: len(v.get("items", [])) for k, v in cc.get("topics", {}).items()})
          PY
